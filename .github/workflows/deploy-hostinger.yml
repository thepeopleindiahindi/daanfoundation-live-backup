name: Build & Deploy to Hostinger (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

      - name: Create deploy zip
        run: |
          cd dist
          zip -r ../dist.zip .

      - name: Upload to Hostinger via FTP
        if: ${{ secrets.HOSTINGER_FTP_HOST && secrets.HOSTINGER_FTP_USERNAME && secrets.HOSTINGER_FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist
          server-dir: ${{ secrets.HOSTINGER_FTP_TARGET_DIR }}
          git-ftp-args: --insecure

      - name: Upload dist.zip as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: dist.zip
